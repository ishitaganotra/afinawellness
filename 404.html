<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afina</title>
<meta name="robots" content="noindex">
<script>
  // GitHub Pages serves this for any unknown path. Invite links are shared
  // as afinawellness.com/i/CODE — rewrite those to the static invite page
  // (/i/?c=CODE). Anything else falls through to the message below.
  (function () {
    var m = location.pathname.match(/^\/i\/([A-Za-z0-9-]{4,20})\/?$/);
    if (m) location.replace('/i/?c=' + encodeURIComponent(m[1].toUpperCase()));
  })();
</script>

    text-align: center; padding: 24px;
